name: pages

# Builds the site with the same github-pages gem environment the legacy branch
# builder used (actions/jekyll-build-pages), so switching to Actions changes who
# runs the build and nothing about how it is built.
#
# baseurl/url come from the committed _config.yml. jekyll-build-pages does not
# inject them, so if the site ever moves - a rename, or a custom domain - that
# file has to be updated to match.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Pages is configured for Actions
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
