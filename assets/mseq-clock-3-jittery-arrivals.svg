<text x="114" y="188" class="s" fill="#ed9d13">a few ms early or late</text>
<text x="330.737" y="188" class="s" fill="#ed9d13" text-anchor="middle">the burst repays it</text>
<text x="258.632" y="205" class="s" fill="#ed9d13" text-anchor="middle">56 ms stall</text>
<text x="494.947" y="205" class="s" fill="#ed9d13" text-anchor="middle">Δ = 0 ms: two ticks in one slice</text>
<line x1="330.737" y1="170" x2="330.737" y2="178" stroke="#ed9d13" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="494.947" y1="170" x2="494.947" y2="195" stroke="#ed9d13" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="20" y="231" width="660" height="102" fill="none" stroke="rgba(219,219,219,0.35)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="32" y="251" class="t">One 17-minute session against a 140 BPM master:</text>
<text x="32" y="268" class="i">gap between arrivals: sd 2.5 ms, spikes to 50–100 ms</text>
<text x="32" y="285" class="i">114 ticks arrived with Δ = 0 ms, batched by the scheduler</text>
<text x="32" y="302" class="t">PD services MIDI in scheduler slices, so several bytes can be handed over at the same logical</text>
<text x="32" y="319" class="t">instant. The bytes are not wrong; their arrival times are.</text>
<rect x="20" y="355" width="660" height="102" fill="none" stroke="#F0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
<text x="32" y="375" class="k" fill="#F0A0A0">And you must not tidy the odd ones away.</text>
<text x="32" y="392" class="t">Drop one tick and the reference it defines moves by (period − Δ) — for good. At about one drop</text>
<text x="32" y="409" class="t">per beat that recorded a 3.15 % slowdown with ±100–290 ms lurches on real hardware.</text>
<text x="32" y="426" class="i">So: every tick counts. How odd a gap looks may inform the estimate of the tempo, never the tick</text>
<text x="32" y="443" class="i">count.</text>
<line x1="20" y1="481" x2="680" y2="481" stroke="rgba(219,219,219,0.35)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="20" y="501" class="t">The loop needs both halves: keep every arrival as evidence about the tempo, and</text>
<text x="20" y="518" class="t">never let a single arrival decide the instant a step fires.</text>
</svg>
