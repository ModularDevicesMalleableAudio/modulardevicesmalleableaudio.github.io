<text x="20" y="36" class="title">Why counting the ticks is not enough</text>
<text x="20" y="53" class="t">Advance the counter on every F8 and the drift does go away — a count corrects</text>
<text x="20" y="70" class="t">itself. But delivery is lumpy, and now the lumps land on the notes.</text>
