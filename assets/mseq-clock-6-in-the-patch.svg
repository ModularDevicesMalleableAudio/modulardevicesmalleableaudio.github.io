<text x="27" y="449" class="i" fill="#5ba711" xml:space="preserve">% 6   % 12   % 24   % 16   % 32   % 64   % 36   % 72   % 144</text>
<text x="20" y="477" class="t">nine clock divisions — sixteenths, triplets, dotted — to every sequencer.</text>
<text x="20" y="494" class="t">Untouched by this work.</text>
<line x1="20" y1="518" x2="680" y2="518" stroke="rgba(219,219,219,0.35)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="20" y="538" class="t">What it cannot fix: below PD's message layer sit audio-block quantisation (about</text>
<text x="20" y="555" class="t">1.45 ms at 64 samples) and MIDI serialisation. Removing those means ticking in the</text>
<text x="20" y="572" class="t">audio domain, or moving to Ableton Link — not a heavier loop.</text>
