<svg xmlns="http://www.w3.org/2000/svg" width="700" height="462" viewBox="0 0 700 462" font-family="'Source Code Pro', ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-label="The default velocity curve: velocity arp values 1 to 8 and the multiplier each one applies to a hit, from zero, a rest, at 1 up to 1.2 at 8, with 6 leaving the velocity unchanged">
<style>.title{font-size:14px;font-weight:700;fill:#DBDBDB}.t{font-size:11px;fill:rgba(219,219,219,0.62)}.i{font-size:11px;fill:#DBDBDB}.h{font-size:11px;font-weight:700;fill:#DBDBDB}</style>
<rect x=".5" y=".5" width="699" height="461" fill="#0b0b0b" stroke="rgba(219,219,219,0.35)" stroke-dasharray="3 3"/>
<text x="20" y="38" class="title">Velocity arp: the default velocity curve</text>
<text x="20" y="59" class="t">Each value is a point on the curve. The hit&#8217;s velocity is</text>
<text x="20" y="76" class="t">multiplied by that point. Each value is drawn in the colour its pad lights.</text>
<line x1="80" y1="334.0" x2="666" y2="334.0" stroke="rgba(219,219,219,0.16)" stroke-dasharray="3 3"/>
<text x="74" y="338.0" class="t" text-anchor="end">&#215;0.0</text>
