<text x="74" y="242.2" class="t" text-anchor="end">&#215;0.5</text>
<line x1="80" y1="142.3" x2="666" y2="142.3" stroke="rgba(219,219,219,0.35)" stroke-dasharray="3 3"/>
<text x="74" y="146.3" class="t" text-anchor="end">&#215;1.0</text>
<text x="666" y="158.3" class="t" text-anchor="end">unchanged</text>
