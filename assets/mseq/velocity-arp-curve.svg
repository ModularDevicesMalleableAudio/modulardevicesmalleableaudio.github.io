<text x="414.0" y="167.1" class="i" text-anchor="middle">&#215;0.80</text>
<rect x="403.0" y="351.0" width="22" height="22" rx="3" fill="#6893ff"/><text x="414.0" y="366.0" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">5</text>
