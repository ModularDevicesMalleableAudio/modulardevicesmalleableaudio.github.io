<text x="660.0" y="396" class="i" text-anchor="middle">120</text>
<text x="64" y="366" class="t" text-anchor="end">value</text>
<text x="64" y="396" class="t" text-anchor="end">sends</text>
<line x1="80" y1="380" x2="666" y2="380" stroke="rgba(219,219,219,0.16)" stroke-dasharray="3 3"/>
<text x="20" y="425" class="t">Sends: the MIDI velocity of a hit with the sequencer&#8217;s velocity knob at 100</text>
<text x="20" y="442" class="t">and the step&#8217;s velocity at the top. Above 6 a hit gets harder, below 6 softer.</text>
