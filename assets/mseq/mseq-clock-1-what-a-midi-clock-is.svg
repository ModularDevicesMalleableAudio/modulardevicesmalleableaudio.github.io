<text x="115.217" y="271" class="s" text-anchor="middle">1/16 step 1</text>
<line x1="206.522" y1="257" x2="336.957" y2="257" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
<line x1="206.522" y1="257" x2="206.522" y2="253" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
