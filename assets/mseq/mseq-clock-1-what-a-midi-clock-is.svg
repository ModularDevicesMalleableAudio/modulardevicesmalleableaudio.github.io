<svg xmlns="http://www.w3.org/2000/svg" width="700" height="513" viewBox="0 0 700 513" font-family="'Source Code Pro', ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-label="MIDI clock explained: the FA, F8 and FC bytes, a ruler showing 24 ticks per beat and six ticks per sixteenth step, and the path from Ableton to MSEQ's note output.">
<style>.title{font-size:14px;font-weight:700;fill:#DBDBDB}.h{font-size:12px;font-weight:700;fill:#DBDBDB}.t{font-size:11px;fill:rgba(219,219,219,0.62)}.i{font-size:11px;fill:#DBDBDB}.k{font-size:11px;font-weight:700;fill:#DBDBDB}.s{font-size:10px;fill:rgba(219,219,219,0.62)}</style>
<rect x=".5" y=".5" width="699" height="512" fill="#0b0b0b" stroke="rgba(219,219,219,0.35)" stroke-dasharray="3 3"/>
<text x="20" y="36" class="title">What a MIDI clock actually is</text>
<text x="20" y="53" class="t">Ableton sends MSEQ one byte, F8, twenty-four times per beat. When those bytes</text>
<text x="20" y="70" class="t">arrive is the only sense of time MSEQ gets from the outside world.</text>
<text x="20" y="98" class="h">The three bytes that matter</text>
<text x="20" y="119" class="k" fill="#86c8ff">FA</text>
<text x="54" y="119" class="i">start</text>
<text x="120" y="119" class="t">go back to the top and run</text>
<text x="20" y="136" class="k" fill="#86c8ff">F8</text>
<text x="54" y="136" class="i">clock</text>
<text x="120" y="136" class="t">one tick — 24 of them in every beat</text>
<text x="20" y="153" class="k" fill="#86c8ff">FC</text>
<text x="54" y="153" class="i">stop</text>
<text x="120" y="153" class="t">stop, and silence every held note</text>
<text x="20" y="174" class="t">No bar number, no position, no timestamp: only arrivals.</text>
<line x1="50" y1="217" x2="650" y2="217" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
<line x1="50" y1="217" x2="50" y2="222" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
<line x1="650" y1="217" x2="650" y2="222" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
<text x="350" y="210" class="t" text-anchor="middle">one beat = 24 ticks</text>
