<text x="271.739" y="271" class="s" text-anchor="middle">1/16 step 2</text>
<line x1="363.043" y1="257" x2="493.478" y2="257" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
<line x1="363.043" y1="257" x2="363.043" y2="253" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
<line x1="493.478" y1="257" x2="493.478" y2="253" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
<text x="428.261" y="271" class="s" text-anchor="middle">1/16 step 3</text>
<line x1="519.565" y1="257" x2="650" y2="257" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
<line x1="519.565" y1="257" x2="519.565" y2="253" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
<line x1="650" y1="257" x2="650" y2="253" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
<text x="584.783" y="271" class="s" text-anchor="middle">1/16 step 4</text>
<text x="20" y="294" class="t">Six ticks make one 1/16 step, so a bar is 96 ticks. A tick lasts 2500 / BPM ms:</text>
<text x="20" y="311" class="i">at 140 BPM that is 17.9 ms, and one step is 107 ms.</text>
<text x="20" y="354" class="h">The whole path</text>
<rect x="20" y="368" width="97.2" height="24" fill="none" stroke="rgba(219,219,219,0.35)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="29" y="384" class="i" fill="#86c8ff">Ableton Live</text>
<line x1="121.2" y1="380" x2="166.55" y2="380" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
<path d="M166.55,376.5 L171.55,380 L166.55,383.5 z" fill="rgba(219,219,219,0.35)"/>
