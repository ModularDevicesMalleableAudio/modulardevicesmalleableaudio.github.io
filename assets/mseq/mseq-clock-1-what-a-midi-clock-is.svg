<text x="184.55" y="384" class="i" fill="#86c8ff">USB MIDI</text>
<line x1="250.35" y1="380" x2="295.7" y2="380" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
<path d="M295.7,376.5 L300.7,380 L295.7,383.5 z" fill="rgba(219,219,219,0.35)"/>
<rect x="304.7" y="368" width="77.4" height="24" fill="none" stroke="rgba(219,219,219,0.35)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="313.7" y="384" class="i" fill="#DBDBDB">Pure Data</text>
<line x1="386.1" y1="380" x2="431.45" y2="380" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
<path d="M431.45,376.5 L436.45,380 L431.45,383.5 z" fill="rgba(219,219,219,0.35)"/>
<rect x="440.45" y="368" width="103.8" height="24" fill="none" stroke="rgba(219,219,219,0.35)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="449.45" y="384" class="i" fill="#5ba711">counter 0 143</text>
<line x1="548.25" y1="380" x2="593.6" y2="380" stroke="rgba(219,219,219,0.35)" stroke-width="1"/>
<path d="M593.6,376.5 L598.6,380 L593.6,383.5 z" fill="rgba(219,219,219,0.35)"/>
<rect x="602.6" y="368" width="77.4" height="24" fill="none" stroke="rgba(219,219,219,0.35)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="611.6" y="384" class="i" fill="#5ba711">notes out</text>
<text x="20" y="411" class="t">MSEQ's master counter runs 0…143 — six beats — and every clock division is</text>
<text x="20" y="428" class="t">a modulo of it. That arithmetic has always been correct.</text>
<line x1="20" y1="452" x2="680" y2="452" stroke="rgba(219,219,219,0.35)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="20" y="472" class="t">So the whole job is this: decide when to advance that counter, using nothing but</text>
<text x="20" y="489" class="t">the arrival times of a stream of identical bytes.</text>
</svg>
