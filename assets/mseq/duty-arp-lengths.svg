<text x="20" y="38" class="title">Duty: how long a note can be</text>
<text x="20" y="59" class="t">Every note length, longest at the top. Step duty lengths are in their pad colours,</text>
<text x="20" y="76" class="t">the rest in the grey of what reaches them. On the right, where each duty arp</text>
<text x="20" y="93" class="t">value moves a step at its default, 1/16.</text>
