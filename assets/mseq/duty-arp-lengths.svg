<svg xmlns="http://www.w3.org/2000/svg" width="700" height="640" viewBox="0 0 700 640" font-family="'Source Code Pro', ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-label="The sixteen note lengths from 1/64 to 1/1 as bars measured in steps, coloured by what reaches them: the step duty view on the default curve gives 1/64 to 1/8, the duty arp takes it up to 1/4, the duty knob at full stretches that to the length of a 1/2, and only a reshaped step duty curve reaches 1/1. Beside the lengths, the duty arp values for a step at its default length, 1/16: 5 leaves it unchanged, 8 is three lengths longer, 1 is four shorter.">
<style>.title{font-size:14px;font-weight:700;fill:#DBDBDB}.t{font-size:11px;fill:rgba(219,219,219,0.62)}.i{font-size:11px;fill:#DBDBDB}.h{font-size:11px;font-weight:700;fill:#DBDBDB}</style>
