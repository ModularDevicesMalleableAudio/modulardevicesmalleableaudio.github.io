<svg xmlns="http://www.w3.org/2000/svg" width="700" height="598" viewBox="0 0 700 598" font-family="'Source Code Pro', ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-label="The sixteen note lengths from 1/64 to 1/1 as bars measured in steps, longest at the top. The default note-length curve gives points 1 to 8 the eight shortest, 1/64 to 1/8, each drawn in the colour of its point; point 5, where a new step starts, is 1/16, one step. The longer lengths, up to 1/1, are only reached by reshaping the curve.">
<style>.title{font-size:14px;font-weight:700;fill:#DBDBDB}.t{font-size:11px;fill:rgba(219,219,219,0.62)}.i{font-size:11px;fill:#DBDBDB}.h{font-size:11px;font-weight:700;fill:#DBDBDB}</style>
