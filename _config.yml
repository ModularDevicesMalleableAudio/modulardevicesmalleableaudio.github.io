
title: Modular Devices / Malleable Audio
email: info.malleable@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  We make modular devices for audio creation, processing, and control, creating 
  malleable audio from modular devices. 
baseurl: "" # site is served from the root, not a /project subpath
url: https://modulardevicesmalleableaudio.github.io # the base hostname & protocol for your site
domain: modulardevicesmalleableaudio.github.io # no http forces https
twitter_username: malleable808
github_username:  ModularDevicesMalleableAudio

# Build settings
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Setting exclude REPLACES Jekyll's defaults rather than adding to them, so the
# defaults are restated here - dropping them publishes Gemfile/Gemfile.lock.
#
# The archive holds the originals of the manual's photographs: kept in git as
# the durable copy, never published. The web-sized derivatives alongside it in
# assets/mseq are what the manual links to. See assets/mseq/archive/README.md.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - assets/mseq/archive/

footer: mdma
header_pages:
  - index.md
  - about.md
  - projects.md
  - documentation.md
  - repos.md